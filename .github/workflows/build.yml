name: Build Windows .exe

on:
  push:
    tags: ["v*"]          # publishing a tag like v1.0.0 builds and attaches the .exe files
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow
      - name: Build the three tools
        shell: pwsh
        run: |
          cd src
          pyinstaller --onefile --name find_missing   find_missing.py
          pyinstaller --onefile --name rename_media   rename_media.py
          pyinstaller --onefile --name library_gallery library_gallery.py
      - name: Collect
        shell: pwsh
        run: |
          mkdir release
          Copy-Item src/dist/*.exe release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath library-tools-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: library-tools-windows
          path: library-tools-windows.zip
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: library-tools-windows.zip
